# Copy configs/gateway.example.toml to ./config.toml at the repository root
# (set listen = "0.0.0.0:8080", base_url = "http://new-api:3000/v1",
# cache_dir = "/data/cache"), then run:
#   docker compose -f deploy/docker-compose.yml up -d --build

services:
  codex-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    image: codex-newapi-gateway:latest
    container_name: codex-newapi-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:17329:8080"
    volumes:
      - ../config.toml:/etc/codex-gateway/config.toml:ro
      - ../data:/data
    networks:
      - edge-proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  edge-proxy:
    external: true
