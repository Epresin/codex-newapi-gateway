[package]
name = "codex-newapi-gateway"
version = "0.1.9"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Headless Codex-to-New-API gateway with per-request model catalog enrichment"
readme = "README.md"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
bytes = "1"
futures-util = "0.3"
hyper = { version = "1", features = ["http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
tokio-util = "0.7"
toml_edit = { version = "0.23", features = ["serde"] }
url = "2"
zstd = "0.13"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
